<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دخول الإدارة | ميجامان محارب النت</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#07111f}
    .login-card{width:min(92%,420px);background:var(--bg-card,#111827);border:1px solid var(--border-color,#243244);border-radius:18px;padding:30px;box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center}
    .login-icon{width:72px;height:72px;margin:0 auto 16px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(0,210,255,.12);color:#00d2ff;font-size:30px}
    .form-input{width:100%;box-sizing:border-box}
    .login-error{display:none;color:#ef4444;margin-top:12px;font-size:.9rem}
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-icon">🔐</div>
    <h2 style="margin-bottom:8px;">لوحة الإدارة</h2>
    <p style="color:var(--text-muted);margin-bottom:20px;">هذه المنطقة خاصة بالإدارة فقط</p>
    <form id="admin-login-form">
      <input id="admin-password" class="form-input" type="password" placeholder="أدخل كلمة المرور" autocomplete="current-password" required>
      <button class="btn-select-pkg" type="submit" style="margin-top:14px;">دخول الإدارة</button>
    </form>
    <div id="login-error" class="login-error"></div>
    <a href="/" class="nav-btn" style="display:inline-flex;width:auto;margin-top:16px;">العودة للموقع</a>
  </div>
<script>
document.getElementById('admin-login-form').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const error=document.getElementById('login-error');
  error.style.display='none';
  try{
    const res=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('admin-password').value})});
    const data=await res.json();
    if(!res.ok || !data.success){ throw new Error(data.error||'تعذر تسجيل الدخول'); }
    location.href='/admin.html';
  }catch(err){ error.textContent=err.message; error.style.display='block'; }
});
</script>
</body>
</html>
